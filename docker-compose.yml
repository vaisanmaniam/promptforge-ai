services:
  postgres:
    image: postgres:16-alpine
    container_name: promptforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promptforge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promptforge_secure_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-promptforge_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promptforge_user} -d ${POSTGRES_DB:-promptforge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - promptforge_network

volumes:
  postgres_data:
    driver: local

networks:
  promptforge_network:
    driver: bridge
